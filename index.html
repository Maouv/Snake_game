<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
<title>🐍 SNAKE — Seismic</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Cinzel+Decorative:wght@700&family=VT323&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#1a0f07;--panel:#221508;--border:#5c3a1e;
  --brown1:#8B5E3C;--brown2:#6B4226;--brown3:#3d1f0a;
  --gold:#d4a042;--gold-glow:#d4a04244;--gold-dim:#a07830;
  --pink:#f0a0c0;--pink2:#e87daa;--pink-glow:#f0a0c055;
  --cream:#f5e6d0;--muted:#7a5a3a;--red:#c0392b;--text:#f0dcc0;
  --snake-head:#c87941;--snake-body:#a0622e;--snake-dark:#7a4820;
  --grid-bg:#150b04;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--bg);
  background-image:radial-gradient(ellipse at 20% 20%,rgba(180,100,40,0.08) 0%,transparent 60%),
    radial-gradient(ellipse at 80% 80%,rgba(100,40,10,0.12) 0%,transparent 60%);
  color:var(--text);font-family:'Press Start 2P',monospace;
  display:flex;flex-direction:column;align-items:center;
  min-height:100dvh;padding:12px 8px 8px;overflow-x:hidden;
  user-select:none;-webkit-user-select:none;
}
body::before{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.06) 3px,rgba(0,0,0,0.06) 4px);
  pointer-events:none;z-index:9999;
}
h1{
  font-family:'Cinzel Decorative',serif;font-size:clamp(1.6rem,6vw,3rem);
  color:var(--gold);text-shadow:0 0 12px var(--gold-dim),0 2px 0 #5a3010;
  letter-spacing:4px;margin-bottom:4px;
}
.subtitle{font-size:0.38rem;color:var(--muted);margin-bottom:10px;letter-spacing:2px;}

/* HUD */
.hud{display:flex;gap:10px;width:100%;max-width:440px;margin-bottom:8px;}
.hud-box{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:7px 10px;flex:1;text-align:center;}
.hud-label{font-size:0.36rem;color:var(--muted);margin-bottom:3px;}
.hud-value{font-family:'VT323',monospace;font-size:1.7rem;color:var(--gold);text-shadow:0 0 6px var(--gold-dim);line-height:1;}
#best-val{color:var(--pink);text-shadow:0 0 6px var(--pink2);}

/* SPEED */
.speed-row{display:flex;gap:6px;margin-bottom:8px;}
.speed-btn{
  font-family:'Press Start 2P',monospace;font-size:0.36rem;
  padding:6px 8px;border:1px solid var(--muted);background:transparent;
  color:var(--muted);border-radius:4px;cursor:pointer;transition:all 0.15s;
}
.speed-btn.active,.speed-btn:hover{border-color:var(--gold);color:var(--gold);text-shadow:0 0 5px var(--gold);background:var(--gold-glow);}

/* CANVAS */
.canvas-wrap{
  position:relative;border:2px solid var(--border);border-radius:6px;
  box-shadow:0 0 24px rgba(180,100,40,0.15),inset 0 0 40px rgba(0,0,0,0.6);
  background:var(--grid-bg);overflow:hidden;
}
canvas{display:block;image-rendering:pixelated;}

/* OVERLAYS */
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:rgba(20,8,2,0.92);gap:14px;backdrop-filter:blur(3px);
}
.overlay.hidden{display:none;}

/* LOGIN */
.login-box{
  background:var(--panel);border:1px solid var(--border);border-radius:8px;
  padding:20px;width:88%;max-width:290px;
  display:flex;flex-direction:column;gap:12px;align-items:center;
}
.login-box h2{font-family:'Cinzel Decorative',serif;font-size:clamp(0.85rem,3vw,1.1rem);color:var(--gold);text-shadow:0 0 8px var(--gold-dim);}
.avatar-pick{
  width:72px;height:72px;border-radius:50%;border:2px solid var(--border);
  background:var(--brown3);display:flex;align-items:center;justify-content:center;
  cursor:pointer;overflow:hidden;transition:border-color 0.2s;
}
.avatar-pick:hover{border-color:var(--gold);}
.avatar-pick img{width:100%;height:100%;object-fit:cover;}
.avatar-hint{font-size:0.33rem;color:var(--muted);text-align:center;}
#avatar-file{display:none;}
.input-wrap{width:100%;}
.input-wrap input{
  width:100%;font-family:'Press Start 2P',monospace;font-size:0.48rem;
  padding:9px 10px;background:var(--brown3);color:var(--cream);
  border:1px solid var(--border);border-radius:4px;outline:none;transition:border-color 0.2s;
}
.input-wrap input:focus{border-color:var(--gold);}
.input-wrap input::placeholder{color:var(--muted);}
.char-count{font-size:0.3rem;color:var(--muted);text-align:right;margin-top:3px;}
.btn{
  font-family:'Press Start 2P',monospace;font-size:0.48rem;
  padding:10px 18px;border:2px solid var(--gold);background:transparent;
  color:var(--gold);border-radius:4px;cursor:pointer;
  text-shadow:0 0 5px var(--gold-dim);box-shadow:0 0 10px var(--gold-glow);
  transition:all 0.15s;width:100%;
}
.btn:hover,.btn:active{background:var(--gold-glow);box-shadow:0 0 20px var(--gold);}
.btn:disabled{opacity:0.4;cursor:not-allowed;}

/* GAME OVER */
.overlay h2.gameover{
  font-family:'Cinzel Decorative',serif;font-size:clamp(1.3rem,5vw,2rem);
  color:var(--red);text-shadow:0 0 12px var(--red);animation:pulse 1s infinite;
}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.04);}}
.score-reveal{font-family:'VT323',monospace;font-size:2rem;color:var(--gold);text-shadow:0 0 8px var(--gold);}
.overlay p{font-size:0.4rem;color:var(--muted);text-align:center;line-height:2;}
.btn-row{display:flex;gap:8px;width:88%;max-width:290px;}
.btn-row .btn{font-size:0.38rem;padding:8px 10px;}

/* LEADERBOARD */
.lb-toggle{
  font-family:'Press Start 2P',monospace;font-size:0.36rem;
  padding:6px 12px;border:1px solid var(--border);background:transparent;
  color:var(--muted);border-radius:4px;cursor:pointer;margin-bottom:8px;transition:all 0.15s;
}
.lb-toggle:hover{border-color:var(--gold);color:var(--gold);}
.lb-panel{
  width:100%;max-width:440px;background:var(--panel);border:1px solid var(--border);
  border-radius:6px;overflow:hidden;margin-bottom:8px;
  max-height:0;transition:max-height 0.35s ease;
}
.lb-panel.open{max-height:340px;}
.lb-header{
  font-family:'Cinzel Decorative',serif;font-size:0.62rem;color:var(--gold);
  padding:10px 14px;border-bottom:1px solid var(--border);text-align:center;letter-spacing:2px;
}
.lb-list{overflow-y:auto;max-height:270px;padding:4px 0;}
.lb-row{
  display:flex;align-items:center;gap:10px;padding:6px 14px;
  border-bottom:1px solid rgba(92,58,30,0.3);
}
.lb-rank{font-family:'VT323',monospace;font-size:1.1rem;color:var(--muted);width:22px;text-align:center;flex-shrink:0;}
.lb-rank.top1{color:#FFD700;text-shadow:0 0 6px #FFD700;}
.lb-rank.top2{color:#C0C0C0;text-shadow:0 0 6px #C0C0C0;}
.lb-rank.top3{color:#CD7F32;text-shadow:0 0 6px #CD7F32;}
.lb-avatar-wrap{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--brown3);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:0.85rem;}
.lb-avatar-wrap img{width:100%;height:100%;object-fit:cover;}
.lb-name{font-size:0.36rem;color:var(--cream);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lb-score{font-family:'VT323',monospace;font-size:1.15rem;color:var(--gold);}
.lb-speed{font-size:0.28rem;color:var(--muted);margin-left:3px;}
.lb-empty,.lb-loading{font-size:0.36rem;color:var(--muted);text-align:center;padding:18px;}
.lb-loading{animation:blink 1s infinite;}
.lb-err{font-size:0.32rem;color:var(--red);text-align:center;padding:14px;line-height:1.8;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}

/* PLAYER BAR */
.player-bar{display:none;align-items:center;gap:8px;width:100%;max-width:440px;margin-bottom:6px;background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:6px 10px;}
.player-bar.visible{display:flex;}
.pb-av{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--brown3);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:0.85rem;}
.pb-av img{width:100%;height:100%;object-fit:cover;}
.pb-name{font-size:0.36rem;color:var(--cream);flex:1;}
.pb-change{font-size:0.3rem;color:var(--muted);cursor:pointer;text-decoration:underline;}
.pb-change:hover{color:var(--gold);}

/* DPAD */
.dpad{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px);gap:4px;margin-top:12px;}
.dpad-btn{display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--border);border-radius:6px;font-size:1.2rem;cursor:pointer;color:var(--text);transition:background 0.1s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.dpad-btn:active{background:var(--gold-glow);box-shadow:0 0 8px var(--gold);}
.dpad-empty{background:transparent;border:none;}
.hint{font-size:0.3rem;color:var(--muted);margin-top:5px;text-align:center;}
</style>
</head>
<body>

<h1>SNAKE</h1>
<div class="subtitle">⬡ SEISMIC EDITION ⬡</div>

<div class="player-bar" id="player-bar">
  <div class="pb-av" id="pb-avatar"><span>🐍</span></div>
  <div class="pb-name" id="pb-name">Player</div>
  <div class="pb-change" id="pb-change">ganti akun</div>
</div>

<div class="hud">
  <div class="hud-box"><div class="hud-label">SCORE</div><div class="hud-value" id="score-val">0</div></div>
  <div class="hud-box"><div class="hud-label">BEST</div><div class="hud-value" id="best-val">0</div></div>
  <div class="hud-box"><div class="hud-label">LENGTH</div><div class="hud-value" id="len-val">3</div></div>
</div>

<div class="speed-row">
  <button class="speed-btn" data-speed="slow">SLOW</button>
  <button class="speed-btn active" data-speed="normal">NORMAL</button>
  <button class="speed-btn" data-speed="fast">FAST</button>
  <button class="speed-btn" data-speed="sonic">SONIC</button>
</div>

<button class="lb-toggle" id="lb-toggle-btn">🏆 LEADERBOARD</button>
<div class="lb-panel" id="lb-panel">
  <div class="lb-header">🏆 Top Players</div>
  <div class="lb-list" id="lb-list"><div class="lb-loading">Memuat...</div></div>
</div>

<div class="canvas-wrap" id="canvas-wrap">
  <canvas id="game"></canvas>

  <!-- LOGIN -->
  <div class="overlay" id="login-overlay">
    <div class="login-box">
      <h2>🐍 SNAKE</h2>
      <div class="avatar-pick" id="avatar-pick" title="Tap untuk pilih foto">
        <span id="avatar-placeholder">📷</span>
      </div>
      <div class="avatar-hint">Foto profil (opsional)</div>
      <input type="file" id="avatar-file" accept="image/*"/>
      <div class="input-wrap">
        <input type="text" id="username-input" placeholder="Username..." maxlength="16" autocomplete="off" spellcheck="false"/>
        <div class="char-count"><span id="char-count">0</span>/16</div>
      </div>
      <button class="btn" id="login-btn" disabled>▶ MULAI</button>
    </div>
  </div>

  <!-- GAME OVER -->
  <div class="overlay hidden" id="over-overlay">
    <h2 class="gameover">GAME OVER</h2>
    <div class="score-reveal" id="final-score">0 pts</div>
    <p id="best-msg"></p>
    <div class="btn-row">
      <button class="btn" id="retry-btn">↺ LAGI</button>
      <button class="btn" id="lb-btn" style="border-color:var(--pink);color:var(--pink);box-shadow:0 0 10px var(--pink-glow);">🏆 LB</button>
    </div>
  </div>
</div>

<div class="dpad">
  <div class="dpad-empty"></div>
  <div class="dpad-btn" id="btn-up">▲</div>
  <div class="dpad-empty"></div>
  <div class="dpad-btn" id="btn-left">◄</div>
  <div class="dpad-empty"></div>
  <div class="dpad-btn" id="btn-right">►</div>
  <div class="dpad-empty"></div>
  <div class="dpad-btn" id="btn-down">▼</div>
  <div class="dpad-empty"></div>
</div>
<div class="hint">Arrow Keys / WASD &nbsp;|&nbsp; D-Pad / Swipe di layar</div>

// ── Config ─────────────────────────────────────────────────────
const COLS = 20, ROWS = 20;
const SPEEDS = { slow:200, normal:130, fast:80, sonic:45 };
let TILE = 20;

// ── State ──────────────────────────────────────────────────────
let snake, dir, nextDir, gem, score, best, gameLoop, running, speed;
let particles = [], gemAnim = 0;
let playerName = '', playerAvatar = null;

const canvas  = document.getElementById('game');
const ctx     = canvas.getContext('2d');
const scoreEl = document.getElementById('score-val');
const bestEl  = document.getElementById('best-val');
const lenEl   = document.getElementById('len-val');

// ── JSONBin Leaderboard ────────────────────────────────────────
async function fetchLB() {
  const res = await fetch(JSONBIN_URL + '/latest', {
    method: 'GET',
    headers: {
      'X-Master-Key': JSONBIN_KEY,
      'X-Bin-Meta': 'false'
    }
  });
  if (!res.ok) {
    const txt = await res.text();
    throw new Error('HTTP ' + res.status + ' — ' + txt);
  }
  const data = await res.json();
  // JSONBin v3 returns { record: {...} } or just the object directly
  const record = data.record !== undefined ? data.record : data;
  return record.leaderboard || [];
}

async function saveLB(entries) {
  const res = await fetch(JSONBIN_URL, {
    method: 'PUT',
    headers: {
      'Content-Type': 'application/json',
      'X-Master-Key': JSONBIN_KEY,
      'X-Bin-Meta': 'false'
    },
    body: JSON.stringify({ leaderboard: entries })
  });
  if (!res.ok) {
    const txt = await res.text();
    throw new Error('HTTP ' + res.status + ' — ' + txt);
  }
}

async function loadLeaderboard() {
  const list = document.getElementById('lb-list');
  list.innerHTML = '<div class="lb-loading">Memuat...</div>';
  try {
    const entries = await fetchLB();
    if (entries.length === 0) {
      list.innerHTML = '<div class="lb-empty">Belum ada pemain.<br>Jadilah yang pertama! 🏆</div>';
      return;
    }
    const top = entries.slice(0, 15);
    list.innerHTML = top.map((e, i) => {
      const rankClass = i===0?'top1':i===1?'top2':i===2?'top3':'';
      const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
      const avHtml = e.avatar
        ? `<div class="lb-avatar-wrap"><img src="${e.avatar}"/></div>`
        : `<div class="lb-avatar-wrap">🐍</div>`;
      return `<div class="lb-row">
        <div class="lb-rank ${rankClass}">${medal}</div>
        ${avHtml}
        <div class="lb-name">${esc(e.name)}</div>
        <div class="lb-score">${e.score}</div>
        <div class="lb-speed">${e.speed||''}</div>
      </div>`;
    }).join('');
  } catch(e) {
    list.innerHTML = `<div class="lb-err">❌ Gagal memuat leaderboard.<br><small style='font-size:0.28rem;word-break:break-all'>${e.message}</small></div>`;
    console.error(e);
  }
}

async function submitScore() {
  if (!playerName || score === 0) return;
  try {
    let entries = await fetchLB();
    // Find existing entry for this player
    const idx = entries.findIndex(e => e.name.toLowerCase() === playerName.toLowerCase());
    const entry = { name: playerName, score, speed, avatar: playerAvatar, ts: Date.now() };
    if (idx >= 0) {
      // Only update if new score is higher
      if (score > entries[idx].score) entries[idx] = entry;
    } else {
      entries.push(entry);
    }
    // Sort & keep top 100
    entries.sort((a,b) => b.score - a.score);
    entries = entries.slice(0, 100);
    await saveLB(entries);
  } catch(e) {
    console.error('Submit score failed:', e);
  }
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Resize ─────────────────────────────────────────────────────
function resize() {
  const maxW = Math.min(window.innerWidth - 24, 440);
  TILE = Math.floor(maxW / COLS);
  canvas.width  = TILE * COLS;
  canvas.height = TILE * ROWS;
  const wrap = document.getElementById('canvas-wrap');
  wrap.style.width  = canvas.width + 'px';
  wrap.style.height = canvas.height + 'px';
  if (running) drawAll();
}

// ── Init ───────────────────────────────────────────────────────
function init() {
  best = parseInt(localStorage.getItem('snake_best_' + playerName) || '0');
  bestEl.textContent = best;
  speed = 'normal';
  resize();
}

function startGame() {
  snake = [{ x:11,y:10 }, { x:10,y:10 }, { x:9,y:10 }];
  dir     = { x:1, y:0 };
  nextDir = { x:1, y:0 };
  score   = 0; particles = []; gemAnim = 0;
  running = true;
  updateHUD();
  placeGem();
  clearInterval(gameLoop);
  gameLoop = setInterval(tick, SPEEDS[speed]);
}

// ── Game Logic ─────────────────────────────────────────────────
function tick() {
  dir = { ...nextDir }; gemAnim++;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS) return endGame();
  if (snake.some(s => s.x===head.x && s.y===head.y))  return endGame();
  snake.unshift(head);
  if (head.x===gem.x && head.y===gem.y) {
    const pts = speed==='slow'?5:speed==='normal'?10:speed==='fast'?20:35;
    score += pts;
    spawnParticles(gem.x, gem.y, '#f0a0c0');
    placeGem();
  } else {
    snake.pop();
  }
  updateHUD();
  drawAll();
}

function placeGem() {
  let pos;
  do { pos = { x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS) }; }
  while (snake.some(s=>s.x===pos.x&&s.y===pos.y));
  gem = pos;
}

async function endGame() {
  clearInterval(gameLoop); running = false;
  if (score > best) {
    best = score;
    localStorage.setItem('snake_best_' + playerName, best);
    bestEl.textContent = best;
  }
  document.getElementById('final-score').textContent = score + ' pts';
  document.getElementById('best-msg').textContent =
    score >= best ? '🏆 NEW BEST SCORE!' : 'Best kamu: ' + best + ' pts';
  document.getElementById('over-overlay').classList.remove('hidden');
  // Submit to leaderboard in background
  submitScore().then(() => loadLeaderboard());
}

function updateHUD() {
  scoreEl.textContent = score;
  bestEl.textContent  = best;
  lenEl.textContent   = snake.length;
}

// ── Particles ──────────────────────────────────────────────────
function spawnParticles(gx, gy, color) {
  for (let i=0;i<12;i++) {
    const angle = Math.random()*Math.PI*2, spd = 1+Math.random()*2.5;
    particles.push({ x:gx*TILE+TILE/2, y:gy*TILE+TILE/2,
      vx:Math.cos(angle)*spd, vy:Math.sin(angle)*spd,
      life:1, color, r:2+Math.random()*3 });
  }
}
function updateParticles() {
  particles = particles.filter(p=>p.life>0);
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.life-=0.055; p.vx*=0.88; p.vy*=0.88; });
}

// ── Drawing ────────────────────────────────────────────────────
const C = { bg:'#150b04', grid:'#1c0e06', head:'#c87941', body:'#a0622e', dark:'#7a4820', eye:'#150b04' };

function drawAll() {
  updateParticles();
  ctx.fillStyle = C.bg; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = C.grid;
  for(let x=0;x<COLS;x++) for(let y=0;y<ROWS;y++)
    ctx.fillRect(x*TILE+TILE/2-1, y*TILE+TILE/2-1, 2, 2);
  drawGem(); drawSnake();
  particles.forEach(p=>{
    ctx.save(); ctx.globalAlpha=p.life; ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); ctx.restore();
  });
}

function drawGem() {
  const t=TILE, pulse=Math.sin(gemAnim*0.12)*0.15+1;
  const size=t-2;
  ctx.save();
  ctx.translate(gem.x*t+t/2, gem.y*t+t/2);
  ctx.scale(pulse,pulse);
  ctx.shadowColor='#f0a0c0'; ctx.shadowBlur=14;
  if (gemReady) {
    ctx.drawImage(SEISMIC_IMG,-size/2,-size/2,size,size);
  } else {
    ctx.fillStyle='#e87daa';
    ctx.beginPath();
    ctx.moveTo(0,-size/2); ctx.lineTo(size*0.45,-size*0.15);
    ctx.lineTo(size*0.3,size/2); ctx.lineTo(-size*0.3,size/2);
    ctx.lineTo(-size*0.45,-size*0.15); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawSnake() {
  snake.forEach((seg,i)=>{
    const isHead=i===0, t=TILE, pad=isHead?1:2;
    const x=seg.x*t+pad, y=seg.y*t+pad, size=t-pad*2;
    ctx.fillStyle = isHead?C.head:i%2===0?C.body:C.dark;
    ctx.globalAlpha = Math.max(0.45, 1-i/(snake.length+5));
    if(isHead){ctx.save();ctx.shadowColor=C.head;ctx.shadowBlur=10;}
    roundRect(ctx,x,y,size,size,isHead?5:4); ctx.fill();
    if(isHead){
      ctx.restore(); ctx.globalAlpha=1;
      const cx=seg.x*t+t/2, cy=seg.y*t+t/2;
      let ex1,ey1,ex2,ey2;
      if(dir.x===1){ex1=cx+4;ey1=cy-3;ex2=cx+4;ey2=cy+3;}
      else if(dir.x===-1){ex1=cx-4;ey1=cy-3;ex2=cx-4;ey2=cy+3;}
      else if(dir.y===-1){ex1=cx-3;ey1=cy-4;ex2=cx+3;ey2=cy-4;}
      else{ex1=cx-3;ey1=cy+4;ex2=cx+3;ey2=cy+4;}
      ctx.fillStyle=C.eye;
      ctx.beginPath();ctx.arc(ex1,ey1,2,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(ex2,ey2,2,0,Math.PI*2);ctx.fill();
    }
  });
  ctx.globalAlpha=1;
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

// ── Controls ───────────────────────────────────────────────────
const KEY_MAP={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0},W:{x:0,y:-1},S:{x:0,y:1},A:{x:-1,y:0},D:{x:1,y:0}};
document.addEventListener('keydown',e=>{
  const d=KEY_MAP[e.key];
  if(d&&running&&!(d.x===-dir.x&&d.y===-dir.y)){nextDir=d;e.preventDefault();}
});
function setDir(d){if(!running)return;if(!(d.x===-dir.x&&d.y===-dir.y))nextDir=d;}
document.getElementById('btn-up').addEventListener('click',()=>setDir({x:0,y:-1}));
document.getElementById('btn-down').addEventListener('click',()=>setDir({x:0,y:1}));
document.getElementById('btn-left').addEventListener('click',()=>setDir({x:-1,y:0}));
document.getElementById('btn-right').addEventListener('click',()=>setDir({x:1,y:0}));

let touchStart=null;
canvas.addEventListener('touchstart',e=>{touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
canvas.addEventListener('touchend',e=>{
  if(!touchStart)return;
  const dx=e.changedTouches[0].clientX-touchStart.x, dy=e.changedTouches[0].clientY-touchStart.y;
  if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
  Math.abs(dx)>Math.abs(dy)?setDir({x:dx>0?1:-1,y:0}):setDir({x:0,y:dy>0?1:-1});
  touchStart=null;
},{passive:true});

// ── Speed ──────────────────────────────────────────────────────
document.querySelectorAll('.speed-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    if(running)return;
    document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); speed=btn.dataset.speed;
  });
});

// ── Leaderboard toggle ─────────────────────────────────────────
document.getElementById('lb-toggle-btn').addEventListener('click',()=>{
  const p=document.getElementById('lb-panel');
  p.classList.toggle('open');
  if(p.classList.contains('open')) loadLeaderboard();
});
document.getElementById('lb-btn').addEventListener('click',()=>{
  document.getElementById('over-overlay').classList.add('hidden');
  const p=document.getElementById('lb-panel');
  p.classList.add('open'); loadLeaderboard();
});

// ── Login ──────────────────────────────────────────────────────
const usernameInput=document.getElementById('username-input');
const loginBtn=document.getElementById('login-btn');
const charCount=document.getElementById('char-count');
const avatarPick=document.getElementById('avatar-pick');
const avatarFile=document.getElementById('avatar-file');

usernameInput.addEventListener('input',()=>{
  charCount.textContent=usernameInput.value.length;
  loginBtn.disabled=usernameInput.value.trim().length<2;
});

avatarPick.addEventListener('click',()=>avatarFile.click());
avatarFile.addEventListener('change',()=>{
  const file=avatarFile.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    playerAvatar=e.target.result;
    avatarPick.innerHTML=`<img src="${playerAvatar}" alt="avatar"/>`;
  };
  reader.readAsDataURL(file);
});

loginBtn.addEventListener('click',()=>{
  playerName=usernameInput.value.trim();
  if(playerName.length<2)return;
  document.getElementById('login-overlay').classList.add('hidden');
  const pb=document.getElementById('player-bar');
  pb.classList.add('visible');
  document.getElementById('pb-name').textContent=playerName;
  const pbAv=document.getElementById('pb-avatar');
  if(playerAvatar) pbAv.innerHTML=`<img src="${playerAvatar}" alt=""/>`;
  init(); startGame();
});

document.getElementById('pb-change').addEventListener('click',()=>{
  clearInterval(gameLoop); running=false;
  document.getElementById('player-bar').classList.remove('visible');
  document.getElementById('over-overlay').classList.add('hidden');
  document.getElementById('login-overlay').classList.remove('hidden');
  usernameInput.value=''; charCount.textContent='0'; loginBtn.disabled=true;
  playerAvatar=null; playerName='';
  avatarPick.innerHTML='<span id="avatar-placeholder">📷</span>';
});

document.getElementById('retry-btn').addEventListener('click',()=>{
  document.getElementById('over-overlay').classList.add('hidden');
  startGame();
});

window.addEventListener('resize',resize);
resize();
</script>
